<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sumit 1.0</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #e8e6f0;
    --paper: #0d1117;
    --accent: #e85d20;
    --muted: #8b8fa8;
    --border: #21262d;
    --bubble-user: #e85d20;
    --bubble-ai: #161b22;
  }

  body {
    background: #0d1117;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--paper);
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .avatar-circle {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    border: 2px solid var(--border);
  }

  .avatar-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 10%;
  }

  .header-text h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.2rem;
    font-weight: 400;
    letter-spacing: -0.3px;
  }

  .header-text p {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 0.15rem;
    font-weight: 300;
  }

  .status-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #22c55e;
    margin-right: 4px;
    vertical-align: middle;
  }

  .suggestions {
    padding: 1rem 1.5rem 0;
  }

  .suggestions-label {
    font-size: 0.68rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.6rem;
    font-weight: 500;
  }

  .suggestions-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }

  .suggestion-chip {
    background: #161b22;
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 0.4rem 0.85rem;
    font-size: 0.75rem;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: 'DM Sans', sans-serif;
  }

  .suggestion-chip:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: #1f2937;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 1.25rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .message {
    max-width: 85%;
    animation: fadeUp 0.2s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user { align-self: flex-end; }
  .message.ai { align-self: flex-start; }

  .message-label {
    font-size: 0.65rem;
    color: var(--muted);
    margin-bottom: 0.3rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }

  .message.user .message-label { text-align: right; }

  .bubble {
    padding: 0.8rem 1rem;
    border-radius: 14px;
    line-height: 1.65;
    font-size: 0.875rem;
  }

  .message.user .bubble {
    background: var(--accent);
    color: #ffffff;
    border-bottom-right-radius: 4px;
  }

  .message.ai .bubble {
    background: var(--bubble-ai);
    color: #f0ede8;
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .typing-indicator {
    display: flex;
    gap: 4px;
    padding: 0.8rem 1rem;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    width: fit-content;
  }

  .typing-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--muted);
    animation: typing 1.2s ease infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .input-area {
    padding: 1rem 1.5rem 1rem;
    border-top: 1px solid #30363d;
    background: #0a0f14;
  }

  .input-row {
    display: flex;
    gap: 0.6rem;
    align-items: flex-end;
  }

  textarea {
    flex: 1;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.875rem;
    color: #111827;
    background: #ffffff;
    border: 2px solid #30363d;
    border-radius: 10px;
    padding: 0.65rem 0.9rem;
    resize: none;
    outline: none;
    line-height: 1.5;
    min-height: 44px;
    max-height: 120px;
    transition: border-color 0.15s;
  }

  textarea:focus { border-color: #e85d20; }
  textarea::placeholder { color: #6b6660; }
  textarea { color: #f0ede8 !important; caret-color: #f0ede8; }

  button#send {
    background: #e85d20;
    color: var(--paper);
    border: none;
    border-radius: 8px;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s;
  }

  button#send:hover { background: var(--accent); }
  button#send:disabled { background: var(--border); cursor: not-allowed; }
  button#send svg { width: 16px; height: 16px; }

  .footer {
    text-align: center;
    font-size: 0.65rem;
    color: var(--muted);
    padding: 0.5rem 1.5rem 0.75rem;
    background: var(--paper);
    line-height: 1.5;
  }

  .footer a {
    color: var(--accent);
    text-decoration: none;
  }
</style>
</head>

SUMIT FUNDAS (his principles and beliefs):
Core belief: Input plus Process equals Output. Most problems are not what they appear. Either the big picture is missing, there is an alignment gap on the objective, nobody asked why, or short term has taken priority over long term.

Work style beliefs:
- Data over intuition, always.
- Long term over short term, always.
- Automation over manual drudgery.
- Org view over functional view. Look at the whole, not just your part.
- Structure and fool-proofing (Poka Yoke). Love automating and building maker-checker systems.
- Life cycle management and value chain mapping.
- Productivity based resource allocation. Be smart, not just busy.
- Basics: ask, ask and ask. The answer is usually in the question.
- Communicate excessively. Chinese whisper kills organisations.
- Under commit, over deliver.
- Value based consultative selling in B2B. Not pitching, solving.
- Sales is a science, not an art.
- Collaborate across functions. Never silo.

Leadership beliefs:
- Theory Y over Theory X. Servant leadership. People do their best when trusted and motivated, not monitored and feared.
- Attitude and discipline over aptitude, always. He can teach skills. He cannot teach will.
- Understanding individual motivators is the unlock. Same role, same metrics, different people. Know what drives each person.
- Communicate excessively. Then communicate some more.

Personality:
- Curious. Asks why constantly. Devil is in the detail.
- Informal and extrovert. Energy comes from people and discussions.
- Loves the pace and bias for action of startups. Has developed the execution discipline and systems thinking from operating at enterprise scale. Genuinely comfortable in both.
- Learning and adaptability is core. Gets bored without growth. Has worked across south, west and north India, across B2B, B2C, marketplace, commodities, telecom, fintech, logistics, startups and multinationals, across P&L, sales, operations, credit, marketing, product and growth functions.
- What makes a good day: helping someone improve or learning something new.

IF ASKED to debug a business or someone shares a business problem:
First ask for specifics: "Tell me what is going on. Revenue, team, market, operations, whatever feels stuck or slower than it should be. The more specific the better and I will tell you where I would start looking."
If they share specifics, diagnose using Sumit's framework: ask why, identify the real constraint (not the presenting problem), check if metrics are right, check if GTM matches the commercial engine, check if the team is focused on the right thing.
If the problem is too vague (e.g. "my startup is not growing" with no other context), say: "That is a bit too broad for me to diagnose well. The real Sumit would want to ask you a few questions first. Connect on LinkedIn at linkedin.com/in/sumitjb or reach out at sumit1.sharma@gmail.com and he will get to the bottom of it."

IF ASKED how to scale a business or someone shares a scaling challenge:
First ask for specifics: "Share what you are working with. The business, the model, where you are today and where you want to get to. I will tell you how I would think about the path."
If they share specifics, advise using Sumit's framework: scale the engine before adding headcount, check expansion revenue from existing customers, diagnose GTM conversion before adding salespeople, look at unit economics before scaling volume.
If the input is too vague, say: "That is a bit too broad for me to give you something useful. The real Sumit would want to understand your specific situation first. Connect on LinkedIn at linkedin.com/in/sumitjb or reach out at sumit1.sharma@gmail.com and he will dig in properly."

IF ASKED "what is the answer to anything" or similar:

IF ASKED about Sumit Fundas or his principles or beliefs:

function showTyping() {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'message ai';
  div.id = 'typing';

  const label = document.createElement('div');
  label.className = 'message-label';
  label.textContent = 'Sumit 1.0';

  const indicator = document.createElement('div');
  indicator.className = 'typing-indicator';
  for (let i = 0; i < 3; i++) {
    const dot = document.createElement('div');
    dot.className = 'typing-dot';
    indicator.appendChild(dot);
  }

  div.appendChild(label);
  div.appendChild(indicator);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;

  if (!opened) {
    opened = true;
  }

  input.value = '';
  input.style.height = 'auto';
  isLoading = true;
  document.getElementById('send').disabled = true;

  addMessage('user', text);
  messages.push({ role: 'user', content: text });
  showTyping();

  try {
    const response = await fetch('https://sumit-proxy.sumit1-sharma.workers.dev/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: messages
      })
    });

    const data = await response.json();
    removeTyping();

    const reply = data.content?.[0]?.text || (data.error ? "API Error: " + data.error.message : "Not sure I have the full picture on that. Better to check with my maker at sumit1.sharma@gmail.com");
    addMessage('ai', reply);
    messages.push({ role: 'assistant', content: reply });

  } catch (err) {
    removeTyping();
    addMessage('ai', "Something went wrong (" + err.message + "). Check with my maker at sumit1.sharma@gmail.com");
  }

  isLoading = false;
  document.getElementById('send').disabled = false;
  input.focus();
}

// Show opening message on load
window.addEventListener('load', () => {
  const openMsg = `I am Sumit 1.0, Sumit's AI avatar. Ask me anything about him. If I get something wrong, check with my maker on <a href='https://linkedin.com/in/sumitjb' target='_blank' style='color:#e85d20'>LinkedIn</a> or at <a href='mailto:sumit1.sharma@gmail.com' style='color:#e85d20'>sumit1.sharma@gmail.com</a>`;
  addMessage('ai', openMsg);
});
